name: ignite3-test

x-ignite-def: &ignite-def
  image: apacheignite/ignite:3.1.0
  environment:
    JVM_MAX_MEM: "4g"
    JVM_MIN_MEM: "4g"

services:
  node1:
    <<: *ignite-def
    command: --node-name node1
    ports:
      - "10300:10300"
      - "10400:10400"
      - "10800:10800"
    configs:
      - source: node_config
        target: /opt/ignite/etc/ignite-config.conf
    volumes:
      - ./certs/node1:/opt/ignite/certs:ro
      - ./work/node1:/opt/ignite/work
  node2:
    <<: *ignite-def
    command: --node-name node2
    ports:
      - "10301:10300"
      - "10401:10400"
      - "10801:10800"
    configs:
      - source: node_config
        target: /opt/ignite/etc/ignite-config.conf
    volumes:
      - ./certs/node2:/opt/ignite/certs:ro
      - ./work/node2:/opt/ignite/work
  node3:
    <<: *ignite-def
    command: --node-name node3
    ports:
      - "10302:10300"
      - "10402:10400"
      - "10802:10800"
    configs:
      - source: node_config
        target: /opt/ignite/etc/ignite-config.conf
    volumes:
      - ./certs/node3:/opt/ignite/certs:ro
      - ./work/node3:/opt/ignite/work
configs:
  node_config:
    content: |
      ignite {
        network {
          port: 3344
          nodeFinder.netClusterNodes = ["node1:3344", "node2:3344", "node3:3344"]
        }

        rest {
          port: 10300
          dualProtocol: false
          httpToHttpsRedirection: false
          ssl {
            enabled: true
            port: 10400
            clientAuth: "none"
            keyStore { 
              type: "PKCS12"
              path: "/opt/ignite/certs/server.p12"
              password: "changeit" }
          }
        }

        clientConnector {
          port: 10800
          ssl {
            enabled: true
            clientAuth: "none"
            keyStore {
              type: "PKCS12"
              path: "/opt/ignite/certs/server.p12"
              password: "changeit"
            }
          }
        }
      }
